name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: javac *.java
      - name: Run the demo
        run: echo "512" | java Main > /dev/null && diff original.txt decrypted.txt
      - name: Run the tests
        run: java RSATest
